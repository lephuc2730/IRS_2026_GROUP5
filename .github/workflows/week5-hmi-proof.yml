name: Week5 HMI Screenshot Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hmi-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4
        with:
          path: student

      - name: Install headless GUI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick
          Xvfb :99 -screen 0 1920x1080x24 -ac > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Clone official unit world and stage Week 5 project
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src
          cp -a student world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5

      - name: Start official Pine-Apple warehouse
        working-directory: world
        run: |
          docker compose pull irs-simulation omron-workspace irs-openplc-runtime
          docker compose up -d irs-simulation omron-workspace irs-openplc-runtime
          sleep 45
          docker compose ps

      - name: Build and run Week 5 publisher
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select pa_warehouse_status
            source install/setup.bash
            ros2 run pa_warehouse_status pineapple_gossip_bot               > /workspace/hmi_publisher.log 2>&1 &
          '
          sleep 7

      - name: Open Robot HMI and capture real screenshot
        run: |
          xdotool search --onlyvisible --name ".*" getwindowname %@ > window_list.txt 2>&1 || true
          cat window_list.txt

          SIM_ID=$(xdotool search --onlyvisible --name "IRS_Warehouse" | head -1)
          echo "Simulation window ID: $SIM_ID"
          xdotool key --window "$SIM_ID" r
          sleep 4
          import -display :99 -window root student/week5_robot_hmi.png

      - name: Collect HMI ROS proof
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            timeout 10s ros2 topic echo /status_updates --once               > /workspace/hmi_status_updates.txt
            timeout 10s ros2 topic echo /hmi/unified_status --once               > /workspace/hmi_plc_status.txt
          '
          mkdir -p hmi-proof
          cp student/week5_robot_hmi.png hmi-proof/
          cp window_list.txt hmi-proof/
          cp workspace/workspace/hmi_*.txt hmi-proof/ 2>/dev/null || true
          cp workspace/workspace/hmi_*.log hmi-proof/ 2>/dev/null || true

      - name: Upload Week 5 HMI evidence
        uses: actions/upload-artifact@v4
        with:
          name: week5-hmi-evidence
          path: world/hmi-proof/

      - name: Stop official warehouse
        if: always()
        working-directory: world
        run: docker compose down -v || true
