name: Official Unit Simulation Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  official-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4
        with:
          path: student

      - name: Install headless X11 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-xserver-utils imagemagick
          Xvfb :99 -screen 0 1920x1080x24 -ac > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Clone official Industrial Robots and Systems world
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src
          cp -a student world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5

      - name: Start official warehouse simulation headlessly
        working-directory: world
        run: |
          docker compose pull irs-simulation omron-workspace irs-openplc-runtime
          docker compose up -d irs-simulation omron-workspace irs-openplc-runtime
          sleep 45
          docker compose ps

      - name: Collect real ROS2 topics from official simulation
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            echo "===== ROS2 TOPIC LIST ====="
            ros2 topic list | tee /workspace/official_topic_list.txt
            echo "===== TOPIC COUNT ====="
            ros2 topic list | wc -l | tee /workspace/official_topic_count.txt
          '

      - name: Prove virtual Hand Solo sensor streams
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            timeout 15s ros2 topic echo /virtual_hand_solo/scan --once               > /workspace/official_scan_sample.txt
            timeout 15s ros2 topic echo /virtual_hand_solo/odom --once               > /workspace/official_odom_sample.txt
            head -80 /workspace/official_scan_sample.txt
            head -80 /workspace/official_odom_sample.txt
          '

      - name: Build project inside official ROS2 workspace container
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select pa_warehouse_status hand_solo_virtual_nav               --event-handlers console_direct+ | tee /workspace/official_build.log
            source install/setup.bash
            ros2 pkg executables pa_warehouse_status | tee /workspace/official_week5_executables.txt
            ros2 pkg executables hand_solo_virtual_nav | tee /workspace/official_week6_executables.txt
          '

      - name: Run Week 5 publisher in official environment
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            source install/setup.bash

            ros2 run pa_warehouse_status pineapple_gossip_bot               > /workspace/official_week5_publisher.log 2>&1 &
            PID=$!
            sleep 4
            timeout 12s ros2 topic echo /status_updates --once               > /workspace/official_status_updates.txt
            kill $PID || true
            wait $PID || true
            cat /workspace/official_status_updates.txt
          '

      - name: Probe likely PLC/HMI topics
        working-directory: world
        continue-on-error: true
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            for topic in /hmi/unified_status /sta_response /sct_response /svr_response; do
              echo "===== $topic =====" | tee -a /workspace/official_plc_probe.txt
              timeout 6s ros2 topic echo "$topic" --once                 >> /workspace/official_plc_probe.txt 2>&1 || true
            done
            cat /workspace/official_plc_probe.txt
          '

      - name: Capture headless simulation screen
        continue-on-error: true
        run: |
          import -display :99 -window root student/official_simulation_screen.png || true

      - name: Copy official-environment proof files
        run: |
          mkdir -p official-proof
          cp -a world/workspace/workspace/official_*.txt official-proof/ 2>/dev/null || true
          cp -a world/workspace/workspace/official_*.log official-proof/ 2>/dev/null || true
          cp -a student/official_simulation_screen.png official-proof/ 2>/dev/null || true
          docker compose -f world/compose.yaml logs --no-color --tail=300 irs-simulation             > official-proof/irs-simulation-container.log 2>&1 || true
          docker compose -f world/compose.yaml logs --no-color --tail=300 omron-workspace             > official-proof/omron-workspace-container.log 2>&1 || true

      - name: Upload official simulation proof
        uses: actions/upload-artifact@v4
        with:
          name: official-unit-simulation-proof
          path: official-proof/

      - name: Stop official simulation
        if: always()
        working-directory: world
        run: docker compose down -v || true
