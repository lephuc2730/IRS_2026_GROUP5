name: Week 7 Map Folder Copy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Week 6 map into Week 7 map folder
        run: |
          mkdir -p hand_solo_virtual_nav/map
          cp hand_solo_virtual_nav/maps/pa_warehouse_map_01.pgm              hand_solo_virtual_nav/map/pa_warehouse_map_01.pgm
          cp hand_solo_virtual_nav/maps/pa_warehouse_map_01.yaml              hand_solo_virtual_nav/map/pa_warehouse_map_01.yaml
          test -s hand_solo_virtual_nav/map/pa_warehouse_map_01.pgm
          test -s hand_solo_virtual_nav/map/pa_warehouse_map_01.yaml

      - name: Commit map resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hand_solo_virtual_nav/map
          git commit -m "Week 7: copy Week 6 map into Nav2 map folder" || true
          git push origin main
