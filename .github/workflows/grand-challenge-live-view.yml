name: Grand Challenge Live Warehouse View

on:
  push:
    branches:
      - fix/integrated-warehouse-cycle
    paths:
      - '.github/workflows/grand-challenge-live-view.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-view:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/integrated-warehouse-cycle

      - name: Start virtual Ubuntu display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick x11-utils wmctrl
          Xvfb :99 -screen 0 1920x1080x24 -ac > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          sleep 3

      - name: Clone official course environment
        run: |
          mkdir -p /tmp/student-copy
          rsync -a --exclude '.git' --exclude 'world' ./ /tmp/student-copy/
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5
          cp -a /tmp/student-copy/. world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5/

      - name: Start Pine-Apple simulator and Hand Solo
        working-directory: world
        run: |
          docker compose pull irs-simulation omron_handsolo omron-workspace irs-openplc-runtime
          docker compose up -d irs-simulation omron_handsolo omron-workspace irs-openplc-runtime
          sleep 70
          docker compose ps

      - name: Build student packages
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select pa_warehouse_status hand_solo_virtual_nav hand_solo_arm
            source install/setup.bash
          '

      - name: Capture live Ubuntu windows
        run: |
          mkdir -p docs/live_view
          echo "=== Visible windows ==="
          wmctrl -l || true
          xdotool search --onlyvisible --name ".*" getwindowname %@ || true

          # OpenGL windows can capture black when obscured. Raise each GUI and
          # capture the X root framebuffer after it has repainted.
          SIM_ID=$(xdotool search --onlyvisible --name "IRS_Warehouse" | head -1 || true)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xdotool search --onlyvisible --name "Warehouse" | head -1 || true)
          fi
          if [ -n "$SIM_ID" ]; then
            xdotool windowmap "$SIM_ID" || true
            xdotool windowactivate --sync "$SIM_ID" || true
            xdotool windowraise "$SIM_ID" || true
            xdotool windowsize "$SIM_ID" 1920 1080 || true
            xdotool windowmove "$SIM_ID" 0 0 || true
            sleep 8
            import -display :99 -window root docs/live_view/pineapple_simulator_front.png || true

            # Capture several camera rotations to expose the warehouse right side.
            # The Pine-Apple viewer uses mouse-drag orbit controls.
            for i in 1 2 3 4; do
              xdotool mousemove 960 520
              xdotool mousedown 1
              xdotool mousemove_relative 260 0 || true
              xdotool mouseup 1
              sleep 3
              import -display :99 -window root "docs/live_view/pineapple_camera_right_${i}.png" || true
            done

            # Also try the opposite drag direction in case the viewer's orbit is inverted.
            xdotool mousemove 960 520
            xdotool mousedown 1
            xdotool mousemove_relative -- -520 0 || true
            xdotool mouseup 1
            sleep 3
            import -display :99 -window root docs/live_view/pineapple_camera_opposite.png || true

            xwd -silent -root -display :99 -out /tmp/simulator_root.xwd || true
            convert /tmp/simulator_root.xwd docs/live_view/pineapple_simulator_xwd.png || true
          fi

          RVIZ_ID=$(xdotool search --onlyvisible --name "RViz" | head -1 || true)
          if [ -n "$RVIZ_ID" ]; then
            xdotool windowactivate --sync "$RVIZ_ID" || true
            xdotool windowraise "$RVIZ_ID" || true
            sleep 5
            import -display :99 -window root docs/live_view/rviz_front.png || true
          fi

          import -display :99 -window root docs/live_view/desktop_full.png || true

      - name: Launch Group 5 Nav2 RViz if no RViz window exists
        working-directory: world
        run: |
          if [ ! -f ../docs/live_view/rviz_live.png ]; then
            WS_ID=$(docker compose ps -q omron-workspace)
            docker exec -d "$WS_ID" bash -lc '
              export DISPLAY=:99
              source /opt/ros/jazzy/setup.bash
              cd /workspace/irs_ws
              source install/setup.bash
              ros2 launch hand_solo_virtual_nav nav_launch.py > /workspace/live_nav.log 2>&1
            '
            sleep 25
            RVIZ_ID=$(xdotool search --onlyvisible --name "RViz" | head -1 || true)
            if [ -n "$RVIZ_ID" ]; then
              import -display :99 -window "$RVIZ_ID" ../docs/live_view/rviz_live.png || true
            fi
          fi

      - name: Capture ROS live state
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            echo "=== /amcl_pose ==="
            timeout 5s ros2 topic echo /amcl_pose --once || true
            echo "=== /map metadata ==="
            timeout 5s ros2 topic echo /map --once | head -n 40 || true
            echo "=== actions ==="
            ros2 action list -t | grep -E "navigate_to_pose|move_action" || true
          ' | tee ../docs/live_view/ros_live_state.txt

      - name: Commit live screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/live_view
          if git diff --cached --quiet; then
            echo "No new live-view files"
            exit 0
          fi
          git commit -m "Capture live Pine-Apple Ubuntu Docker warehouse view"
          git push

      - name: Stop containers
        if: always()
        working-directory: world
        run: docker compose down
